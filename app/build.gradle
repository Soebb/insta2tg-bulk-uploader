plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.soebb.instabulk'
    compileSdk 35

    defaultConfig {
        applicationId 'com.soebb.instabulk'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        version '3.11'

        // Install normal runtime dependencies with their own requirements.
        pip {
            install 'yt-dlp'
            install 'python-socks[asyncio]'
            install 'aiosqlite'
        }

        // Wzgram's WarpCrypto dependency is supplied by our Rust JNI adapter.
        // Install Wzgram itself without asking pip for the unavailable PyPI wheel.
        pip {
            options '--no-deps'
            install 'wzgram==3.1.7'
        }
    }
}
