plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

dependencies {
    // Generated by gomobile bind in the Android build workflow.
    implementation files('libs/gogram.aar')
}

android {
    namespace 'com.soebb.instabulk'
    compileSdk 35

    defaultConfig {
        applicationId 'com.soebb.instabulk'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        version '3.11'
        pip {
            install 'yt-dlp'
        }
    }
}
