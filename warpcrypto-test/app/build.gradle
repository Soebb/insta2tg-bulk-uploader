plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.soebb.warpcryptotest'
    compileSdk 35

    defaultConfig {
        applicationId 'com.soebb.warpcryptotest'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        version '3.11'
        pip {
            install 'wheels/warpcrypto-2.2.0-1-cp311-cp311-android_24_arm64_v8a.whl'
        }
    }
}
