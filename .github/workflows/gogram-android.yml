name: Gogram Android bridge

on:
  push:
    branches: [gogram-android-transfers]
  pull_request:
    branches: [gogram-android-transfers]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-gogram-aar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
          cache-dependency-path: mobile/gogram/go.mod

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # setup-android@v3 defaults to installing the obsolete "tools"
      # package. Install only platform-tools; install the pinned NDK below.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK
        run: sdkmanager --install "ndk;27.2.12479018"

      - name: Install gomobile tools
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Register gomobile tool dependency
        working-directory: mobile/gogram
        run: go get -tool golang.org/x/mobile/cmd/gobind@latest

      - name: Resolve Go dependencies
        working-directory: mobile/gogram
        run: go mod tidy

      - name: Test Go bridge
        working-directory: mobile/gogram
        run: go test ./...

      - name: Initialize gomobile
        run: gomobile init

      - name: Build Android AAR
        working-directory: mobile/gogram
        run: |
          mkdir -p ../../app/libs
          gomobile bind -v -target=android/arm,android/arm64 -androidapi 24 \
            -javapkg com.soebb.gogram -o ../../app/libs/gogram.aar .

      - name: Validate Python engine syntax
        run: python -m compileall -q app/src/main/python/engine.py

      - name: Upload Gogram AAR
        uses: actions/upload-artifact@v4
        with:
          name: gogram-android-aar
          path: app/libs/gogram.aar
          if-no-files-found: error

      # Chaquopy needs a matching host Python interpreter to build Python
      # requirements. The runner's preinstalled Python may not include 3.11.
      - name: Set up Python for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Android build platform
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK with Gogram and Chaquopy
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: instagram-bulk-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
