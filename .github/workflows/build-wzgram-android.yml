name: Build Wzgram Android APK

on:
  push:
    branches: [wzgram-android]
    paths:
      - "app/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - ".github/workflows/build-wzgram-android.yml"
  workflow_dispatch:
    inputs:
      wheel_run_id:
        description: "Successful GitHub Actions run ID containing the Android WarpCrypto wheel"
        required: true
        default: "45340620380"

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build Wzgram APK with Android WarpCrypto
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Android WarpCrypto wheel
        uses: actions/download-artifact@v4
        with:
          name: warpcrypto-android-arm64-cp311
          path: app/wheels
          repository: ${{ github.repository }}
          run-id: ${{ inputs.wheel_run_id || '45340620380' }}
          github-token: ${{ github.token }}

      - name: Verify Android wheel
        shell: bash
        run: |
          set -euo pipefail
          ls -lah app/wheels
          test -f app/wheels/warpcrypto-2.2.0-1-cp311-cp311-android_24_arm64_v8a.whl
          python3 - <<'PY'
          import zipfile
          path = "app/wheels/warpcrypto-2.2.0-1-cp311-cp311-android_24_arm64_v8a.whl"
          with zipfile.ZipFile(path) as wheel:
              names = wheel.namelist()
              assert any(name.endswith("warpcrypto.so") for name in names), names
              metadata = next(name for name in names if name.endswith(".dist-info/WHEEL"))
              print(wheel.read(metadata).decode())
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="/usr/local/lib/android/sdk"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | sort | tail -n 1)
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          test -d "$SDK_ROOT/platforms/android-35"
          test -d "$SDK_ROOT/build-tools/35.0.0"

      - name: Set up Python 3.11 for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Validate Python source
        run: python -m compileall -q app/src/main/python

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload Wzgram APK
        uses: actions/upload-artifact@v4
        with:
          name: instagram-bulk-wzgram-android-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
