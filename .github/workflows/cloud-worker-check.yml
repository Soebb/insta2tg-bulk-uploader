name: Cloud Worker Check

on:
  push:
    branches:
      - cloud-streaming-pipeline
    paths:
      - "cloud/**"
      - ".github/workflows/cloud-worker-check.yml"
  pull_request:
    paths:
      - "cloud/**"
      - ".github/workflows/cloud-worker-check.yml"

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile cloud worker
        run: python -m compileall -q cloud
