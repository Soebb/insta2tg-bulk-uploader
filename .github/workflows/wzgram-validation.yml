name: Wzgram Python validation

on:
  push:
    branches: [wzgram-all-transfers]
  pull_request:
    branches: [wzgram-all-transfers]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install desktop dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q main.py app/src/main/python/engine.py
      - name: Verify Wzgram imports
        run: |
          python - <<'PY'
          from wzgram import Client, filters
          from wzgram.types import InputMediaPhoto, InputMediaVideo
          from wzgram.errors import FloodWait
          print("Wzgram Client, filters, media types and FloodWait imports are available.")
          PY
