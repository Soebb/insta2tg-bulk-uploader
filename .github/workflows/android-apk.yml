name: Android Debug APK
# Includes the Telethon MTProto HTTPS upload branch.

on:
  push:
    branches:
      - android-native-downloader
      - kurigram-large-upload
      - telethon-https-migration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Android-compatible pure Python dependency wheels
        run: |
          python -m pip wheel --no-deps --wheel-dir app/wheels pyaes==1.6.1

      - name: Verify build tools
        run: |
          java -version
          python3.11 --version

      - name: Build debug APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.13'
          arguments: assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: instagram-bulk-downloader-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
