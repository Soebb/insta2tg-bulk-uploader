name: Android Debug APK
# Builds debug APKs for the Telegram HTTPS upload experiments, including upload-only isolation.

on:
  push:
    branches:
      - telethon-https-migration
      - telethon-https-upload-isolated
      - telethon-https-auth-diagnostics
      - telethon-apiw1-test
      - telethon-upload-only-https
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Android-compatible pure Python dependency wheels
        run: |
          python -m pip wheel --no-deps --wheel-dir app/wheels \
            pyaes==1.6.1 rsa==4.9.1 pyasn1==0.6.1 telethon==1.46.0

      - name: Verify build tools
        run: |
          java -version
          python3.11 --version

      - name: Verify target branch and Android transport
        run: |
          test "$GITHUB_REF" = "refs/heads/telethon-https-migration" -o "$GITHUB_REF" = "refs/heads/telethon-https-upload-isolated" -o "$GITHUB_REF" = "refs/heads/telethon-https-auth-diagnostics" -o "$GITHUB_REF" = "refs/heads/telethon-apiw1-test" -o "$GITHUB_REF" = "refs/heads/telethon-upload-only-https"
          echo "Building commit: $(git rev-parse HEAD)"
          grep -q "from telethon import TelegramClient" app/src/main/python/engine.py
          if [ "$GITHUB_REF" = "refs/heads/telethon-upload-only-https" ]; then
            # The ordinary client must keep Telethon's default transport.
            # Only the dedicated upload client may use the custom HTTPS route.
            grep -q "upload_client = TelegramClient(" app/src/main/python/engine.py
            grep -q "connection=TelegramHttpsConnection" app/src/main/python/engine.py
            grep -q "await client.send_file(" app/src/main/python/engine.py
            grep -q "await upload_client.upload_file(" app/src/main/python/engine.py
            # The HTTPS client must use Telethon's standard HTTP codec over TLS.
            grep -q "from telethon.network import ConnectionHttp" app/src/main/python/telegram_https.py
            grep -q "class TelegramHttpsConnection(ConnectionHttp)" app/src/main/python/telegram_https.py
            grep -q "super().__init__(" app/src/main/python/telegram_https.py
            grep -q "web.telegram.org:443/api" app/src/main/python/telegram_https.py
          else
            grep -q "connection=TelegramHttpsConnection" app/src/main/python/engine.py
          fi
          grep -q "part_size_kb = 512" app/src/main/python/engine.py
          grep -q "TELETHON_VIDEO_THRESHOLD = BOT_API_UPLOAD_LIMIT" app/src/main/python/engine.py
          if grep -Eiq "kurigram|pyrogram" app/src/main/python/engine.py app/build.gradle; then
            echo "Legacy Kurigram/Pyrogram dependency detected; refusing to build."
            exit 1
          fi

      - name: Build debug APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.13'
          arguments: assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: instagram-bulk-downloader-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
