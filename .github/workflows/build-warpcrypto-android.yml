name: Build WarpCrypto Android wheel

on:
  push:
    branches: [warpcrypto-android]
    paths:
      - "android-wheels/warpcrypto/**"
      - ".github/workflows/build-warpcrypto-android.yml"
  pull_request:
    branches: [warpcrypto-android]
    paths:
      - "android-wheels/warpcrypto/**"
      - ".github/workflows/build-warpcrypto-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-arm64:
    name: WarpCrypto for Android arm64-v8a (Chaquopy Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Configure preinstalled Android SDK
        run: |
          test -d "$ANDROID_HOME"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" || find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -name sdkmanager -type f
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | head -n 1)
          test -n "$SDKMANAGER"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Install Android NDK
        run: |
          "$SDKMANAGER" "ndk;27.2.12479018"
          test -d "$ANDROID_NDK_HOME"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf
          python -m pip install --upgrade pip
          git clone --branch 17.1.0 --depth 1 https://github.com/chaquo/chaquopy.git "$RUNNER_TEMP/chaquopy"
          test "$(git -C "$RUNNER_TEMP/chaquopy" describe --tags --exact-match)" = "17.1.0"
          echo "Using official Chaquopy GitHub release: $(git -C "$RUNNER_TEMP/chaquopy" rev-parse HEAD)"
          python -m pip install -r "$RUNNER_TEMP/chaquopy/server/pypi/requirements.txt"

      - name: Download matching Chaquopy Python runtime
        working-directory: ${{ runner.temp }}/chaquopy
        run: |
          test -d "$ANDROID_NDK_HOME"
          target/download-target.sh maven/com/chaquo/python/target/3.11.17-0
          target_zip=$(find maven/com/chaquo/python/target/3.11.17-0 -name 'target-3.11.17-0-arm64-v8a.zip' -print -quit)
          test -n "$target_zip"
          echo "Checking stable-ABI Python library in $target_zip"
          unzip -l "$target_zip" | grep -F 'jniLibs/arm64-v8a/libpython3.so'

      - name: Patch Chaquopy 17.1 duplicate Python SONAME handling
        working-directory: ${{ runner.temp }}/chaquopy
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("server/pypi/build-wheel.py")
          source = path.read_text()
          old = '''                if link_filename != filename:
                    run(f"ln -s {filename} {reqs_lib_dir}/{link_filename}")
          '''
          new = '''                # Different Python SONAMEs may map to the same linker name.
                if (link_filename != filename
                        and not exists(f"{reqs_lib_dir}/{link_filename}")
                        and not islink(f"{reqs_lib_dir}/{link_filename}")):
                    run(f"ln -s {filename} {reqs_lib_dir}/{link_filename}")
          '''
          if old not in source:
              raise SystemExit("Chaquopy 17.1 SONAME block did not match; refusing an unsafe patch")
          path.write_text(source.replace(old, new, 1))
          print("Patched duplicate Python SONAME handling.")
          PY

      - name: Build WarpCrypto wheel
        working-directory: ${{ runner.temp }}/chaquopy/server/pypi
        run: |
          python build-wheel.py --verbose --python 3.11 --abi arm64-v8a --api-level 24 "$GITHUB_WORKSPACE/android-wheels/warpcrypto"

      - name: Verify Android wheel and ELF architecture
        shell: bash
        run: |
          set -euo pipefail
          wheel=$(find "$RUNNER_TEMP/chaquopy/server/pypi/dist/warpcrypto" -maxdepth 1 -name '*.whl' -print -quit)
          test -n "$wheel"
          echo "Built: $wheel"
          unzip -p "$wheel" '*/WHEEL'
          mkdir -p "$RUNNER_TEMP/wheel-check"
          python -m zipfile -e "$wheel" "$RUNNER_TEMP/wheel-check"
          so=$(find "$RUNNER_TEMP/wheel-check" -type f -name 'warpcrypto*.so' -print -quit)
          test -n "$so"
          readelf -h "$so" | grep -E 'Class:|Machine:'
          readelf -h "$so" | grep -q 'AArch64'

      - name: Upload Android wheel
        uses: actions/upload-artifact@v4
        with:
          name: warpcrypto-android-arm64-cp311
          path: ${{ runner.temp }}/chaquopy/server/pypi/dist/warpcrypto/*.whl
          if-no-files-found: error
          retention-days: 14
